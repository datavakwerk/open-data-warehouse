version: 2

models:
  - name: mart_gebrek_top
    description: >
      Eén rij per gebrek per voertuigsoort per jaar van eerste toelating,
      19.703 rijen. aantal_gebreken is optelbaar (som van de constante uit het feit);
      rang is het rangnummer binnen voertuigsoort × jaar, aflopend op aantal.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [gebrek_identificatie, voertuigsoort, jaar_eerste_toelating]
    columns:
      - name: gebrek_identificatie
        data_tests: [not_null]
      - name: voertuigsoort
        data_tests: [not_null]
      - name: jaar_eerste_toelating
        description: >
          year(datum_eerste_toelating) — geen bouwjaar; voor importvoertuigen wijken
          die af. Null als het voertuig geen toelatingsdatum heeft.
      - name: rang
        description: 1 = vaakst geconstateerd binnen voertuigsoort × jaar.
        data_tests: [not_null]
  - name: mart_voertuigpark_herindeling
    description: >
      Eén rij per gemeente per peiljaar per
      voertuigsoort (15.936 rijen, 2015-2025 — CBS levert nog geen 2026). Reeksen zijn
      over herindelingen heen vergelijkbaar: gemeente_naam_nu is de nieuwste naam per
      code (via de laatste SCD2-versie, niet via is_actueel — 72 opgeheven codes hebben
      geen actuele versie), naam_destijds de naam in het peiljaar zelf.

      BEPERKING. De PRD vraagt "per brandstofsoort per gemeente"; die grain bestaat bij
      CBS niet (zie docs/data.md). Deze mart levert gemeente × voertuigsoort; de
      brandstofsplitsing bestaat alleen landelijk via RDW (8 soorten).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [gemeente_code, peiljaar, voertuigsoort]
    columns:
      - name: gemeente_naam_nu
        data_tests: [not_null]
      - name: naam_destijds
        data_tests: [not_null]
      - name: bestaat_nog
        description: >
          False voor de 72 codes die sinds 2015 zijn opgeheven; hun reeks eindigt in
          hun laatste peiljaar. Dat is historie, geen datafout.
        data_tests: [not_null]
      - name: aantal
        data_tests: [not_null]
  - name: mart_rdw_cbs_aansluiting
    description: >
      PRD-vraag 3. Aandeel per voertuigsoort in de RDW-steekproef (500k kentekens,
      momentopname 2026-07-29) naast het aandeel in het CBS-park (laatst beschikbare
      peiljaar, nu 2025). Absolute aantallen zijn onvergelijkbaar — de steekproef is
      ~3,6% van het park — dus de mart vergelijkt verdelingen. Mapping-oordelen:
      Bus telt als Bedrijfsmotorvoertuig, zijspan als Motorfiets; aanhangwagens,
      opleggers en landbouwvoertuigen kennen geen CBS-categorie en staan als
      '(niet vergelijkbaar)' buiten de noemer.
    columns:
      - name: voertuigsoort_cbs
        description: Een nieuwe RDW-soort zonder mapping wordt null en valt hier.
        data_tests: [unique, not_null]
      - name: aandeel_rdw
        description: Aandeel binnen de vergelijkbare soorten; null voor de restgroep.
      - name: aandeel_cbs
        description: >
          Null voor '(niet vergelijkbaar)' — die rij bestaat alleen aan de RDW-kant.
          Bewust geen not_null: de null ís de informatie.