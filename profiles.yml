# Dit profiel staat bewust in de repo, niet in ~/.dbt/. Het pad naar de database is
# relatief, dus `dbt build` werkt in CI zonder extra setup. *.duckdb is gitignored.
nl_vehicle_warehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: dev.duckdb
      threads: 4

    # CI bouwt op de fixtures uit tests/fixtures/ (zie commit 3), niet op data/raw/.
    ci:
      type: duckdb
      path: ci.duckdb
      threads: 4
