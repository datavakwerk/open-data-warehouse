version: 2

models:
  - name: dim_datum
    description: >
      Eén rij per kalenderdag van 1990-01-01 t/m 2029-12-31, plus één onbekend-lid-rij
      met datum_key -1. Gegenereerd met dbt_utils.date_spine; feestdagen komen uit de
      macro nl_feestdagen.

      SLEUTELCONVENTIE. datum_key is een leesbare integer JJJJMMDD (20240315), zodat een
      mart op datum kan filteren zonder join. Alle andere dimensies gebruiken een md5-hash
      via dbt_utils.generate_surrogate_key. Het onbekende lid is -1 (integer) hier en
      '-1' (varchar) in de gehashte dimensies.
    columns:
      - name: datum_key
        description: JJJJMMDD als integer. -1 is het onbekende lid (datum 1900-01-01).
        data_tests: [unique, not_null]
      - name: datum
        data_tests: [unique, not_null]
      - name: weeknummer
        description: ISO-weeknummer. Gebruik samen met iso_jaar, niet met jaar — 2029-12-31 valt in ISO-week 1 van 2030.
      - name: is_feestdag
        description: >
          Officiële Nederlandse feestdagen. 438 stuks in het bereik. Bevrijdingsdag telt
          mee, ook al is die niet elk jaar een vrije dag.
        data_tests: [not_null]
      - name: feestdag_naam
        description: >
          Null als het geen feestdag is. Op 2005-05-05 en 2016-05-05 staat er
          'Bevrijdingsdag en Hemelvaartsdag' — twee feestdagen op één datum.
      - name: is_werkdag
        description: Maandag t/m vrijdag én geen feestdag. 10.134 van de 14.610 dagen.
  - name: dim_brandstof
    description: >
        Type 1. Eén rij per brandstofsoort uit stg_rdw__brandstof, plus het onbekende lid
        '-1'. 8 soorten op data/raw (9 rijen), 7 in de CI-fixtures (8 rijen) — Alcohol komt
        niet voor in de eerste 5.000 kentekens. Zet hier dus geen rijaantaltest op.
    columns:
      - name: brandstof_key
        description: Surrogate key for the brandstof dimension.
        data_tests: [unique, not_null]
      - name: brandstof_omschrijving
        description: Description of the brandstof type.
        data_tests: [unique, not_null]
      - name: energiedrager
        description: >
          Fossiel / Emissievrij / Biobrandstof. De case heeft bewust geen else-tak: een
          onbekende negende soort wordt null en maakt
          assert_brandstof_energiedrager_bekend rood in plaats van stilzwijgend fossiel.
  - name: dim_gebrek
    description: >
      Type 1. Volledige RDW-referentielijst, 1.006 codes plus het onbekende lid '-1'.
      Slechts 622 codes komen voor in de constateringen (385 in de fixtures); dat is
      normaal voor een referentielijst. Test relationships van feit naar dimensie, nooit
      andersom.
    columns:
      - name: gebrek_key
        data_tests: [unique, not_null]
      - name: gebrek_identificatie
        data_tests: [unique, not_null]
      - name: gebrek_omschrijving
        description: Niet uniek — 1.006 codes delen 972 omschrijvingen.
        data_tests: [not_null]
      - name: is_actueel
        description: >
          Afgeleid van einddatum_gebrek is null. 788 van de 1.006 codes zijn nog geldig;
          een lege einddatum betekent "nog geldig", niet "onbekend".
        data_tests: [not_null]
  - name: dim_voertuig
    description: >
      Type 1, één rij per kenteken (500.000 + het onbekende lid '-1'). Typekenmerken zijn
      gedenormaliseerd op de dimensie; er is bewust geen dim_voertuigtype. merk en
      handelsbenaming zijn genormaliseerd met upper(trim()) — dat hoorde niet in staging,
      want daar geldt 1:1 met de bron.
    columns:
      - name: voertuig_key
        description: md5 over kenteken. Feiten coalescen naar '-1'.
        data_tests: [unique, not_null]
      - name: kenteken
        data_tests: [unique, not_null]
      - name: handelsbenaming
        description: upper(trim()) brengt 27.409 varianten terug naar 27.363.
      - name: hoofdbrandstof
        description: >
          Brandstof van volgnummer 1. NULL voor 69.504 kentekens die geen brandstofrij
          hebben — aanhangwagens en opleggers. Dat is correct, geen ontbrekende data;
          daarom staat er geen not_null op.
      - name: datum_eerste_toelating
        description: >
          Gewone date, geen foreign key naar dim_datum. De spine begint in 1990 en deze
          kolom gaat terug tot 1915-06-30 (32.844 voertuigen vóór 1990).
  - name: bridge_voertuig_brandstof
    description: >
      Eén rij per kenteken per brandstofvolgnummer, 443.167 rijen over 430.496 voertuigen.
      12.671 voertuigen hebben meer dan één brandstof (hybrides).

      GEBRUIK. dim_voertuig.hoofdbrandstof voor standaardvragen; deze bridge zodra
      hybrides ertoe doen. Tellen via de bridge zonder filter op is_hoofdbrandstof geeft
      443.167 in plaats van 430.496 voertuigen — 2,9% te veel.
    
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [voertuig_key, volgnummer]
    columns:
      - name: voertuig_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_voertuig')
              field: voertuig_key
      - name: brandstof_key
        description: >
          md5 over brandstof_omschrijving — exact dezelfde expressie als in
          dim_brandstof. Wijkt de expressie af, dan wijkt de hash af en faalt de
          relationships-test op elke rij.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_brandstof')
              field: brandstof_key
      - name: volgnummer
        description: 1, 2 of 3. Verdeling 430.496 / 12.657 / 14.
        data_tests: [not_null]
      - name: is_hoofdbrandstof
        data_tests: [not_null]
  - name: dim_gemeente
    description: >
      SCD type 2 op de gemeentelijke indeling, opgebouwd uit 12 jaarlijkse CBS-snapshots
      (2015-2026). 420 versierijen over 414 gemeentecodes, plus het onbekende lid '-1'.
      342 daarvan zijn actueel; 72 codes zijn sinds 2015 opgeheven.

      VERSIONERING. Alleen gemeente_naam telt als wijziging. agglomeratie_naam wijzigt bij
      51 codes zonder dat er aan de gemeente iets verandert (CBS herindeelt zijn eigen
      agglomeraties); die meenemen zou de dimensie op 475 rijen brengen met 55 versierijen
      zonder gemeentelijke gebeurtenis erachter. agglomeratie_naam en arbeidsmarktregio
      zijn daarom attributen van de versie, niet de aanleiding ervan — bij een wijziging
      binnen een versie staat de alfabetisch laatste waarde in de rij.

      GELDIG_TOT. 31-12 van het laatste peiljaar van de versie, of 9999-12-31 voor de
      actuele versie. Nooit null: een between-join op null geeft geen match en zou elke
      actuele gemeente stilzwijgend naar '-1' sturen. Deze afleiding leunt erop dat geen
      enkele code een gat in zijn peiljaren heeft; dat bewaakt
      assert_gemeente_aaneengesloten_peiljaren.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [gemeente_code, versienummer]
    columns:
      - name: gemeente_key
        description: md5 over gemeente_code + versie. Feiten joinen hierop, niet op gemeente_code.
        data_tests: [unique, not_null]
      - name: gemeente_code
        description: CBS-code (GM....). Niet uniek — 6 codes hebben twee versies.
        data_tests: [not_null]
      - name: gemeente_naam
        data_tests: [not_null]
      - name: geldig_van
        description: 1 januari van het eerste peiljaar van de versie.
        data_tests: [not_null]
      - name: geldig_tot
        description: 31 december van het laatste peiljaar, of 9999-12-31 als de versie actueel is.
        data_tests: [not_null]
      - name: is_actueel
        description: >
          True voor de versie die in het laatste peiljaar (2026) nog bestaat. 342 rijen.
          Join in feiten NOOIT op is_actueel — zie commit 10.
        data_tests: [not_null]